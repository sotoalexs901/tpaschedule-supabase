[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."flight-watch-sync-scheduled"]
  schedule = "*/5 * * * *"
[functions."airport-weather-sync-scheduled"]
  schedule = "*/15 * * * *"
# Arrival Readiness: uses Flight Watch data already stored in Firebase.
# It does NOT make additional Flightradar24 API calls.
[functions."arrival-readiness-sync-scheduled"]
  schedule = "*/5 * * * *"

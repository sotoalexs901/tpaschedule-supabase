<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>AeroStation Hub</title>

    <meta
      name="description"
      content="AeroStation Hub - Operational Management Platform"
    />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/icons/favicon.png"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Apple / iPhone / iPad -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="AeroStation Hub"
    />

    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
    />

    <!-- Seasonal PWA artwork is selected when the page is opened or installed.
         iPadOS may cache already-installed home-screen icons. -->
    <script>
      (function () {
        const date = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());
        const season = date < "2026-12-01" ? "birthday"
          : date < "2026-12-26" ? "christmas"
          : date < "2027-02-16" ? "newyear" : "";
        if (!season) return;
        const prefix = "/icons/seasonal/" + season;
        const apple = document.querySelector('link[rel="apple-touch-icon"]');
        if (apple) apple.href = prefix + "-180.png";
        const manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) {
          const seasonalManifest = {
            name: "AeroStation Hub", short_name: "AeroStation",
            description: "AeroStation Hub - Operational Management Platform",
            id: "/", start_url: "/?source=pwa", scope: "/",
            display: "standalone", orientation: "any",
            background_color: "#0b1120", theme_color: "#0b1120",
            icons: [
              { src: prefix + "-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
              { src: prefix + "-512.png", sizes: "512x512", type: "image/png", purpose: "any" }
            ]
          };
          manifest.href = URL.createObjectURL(new Blob([JSON.stringify(seasonalManifest)], {type: "application/manifest+json"}));
        }
      })();
    </script>

    <!-- Avoid automatic phone-number styling inside operational data -->
    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
